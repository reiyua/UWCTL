name: Hardware report
description: Tell us how uwctl works (or doesn't) on your laptop
title: "[hardware] <brand> <model> (<board name>)"
labels: ["hardware"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks! Reports like this are how uwctl learns about new models.
        Please send one even if everything works.
  - type: input
    id: model
    attributes:
      label: Laptop brand and model
      description: As sold, e.g. "XMG Core 15 (2020)". The board name is in the doctor output.
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Distribution, kernel, desktop
      placeholder: Arch Linux, 7.3.6-arch1-1, KDE Plasma 6
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `uwctl doctor`
      render: text
    validations:
      required: true
  - type: checkboxes
    id: works
    attributes:
      label: What works?
      options:
        - label: Keyboard colour
        - label: Keyboard brightness
        - label: Keyboard effects
        - label: Fan Max / Auto
        - label: Custom fan curve (fans follow the curve under load)
        - label: Office / Gaming / Turbo profiles make a noticeable difference
        - label: Lightbar
        - label: GUI opens and connects
  - type: textarea
    id: notes
    attributes:
      label: Anything odd?
      description: Wrong colours, brightness steps, fans behaving strangely, errors from `journalctl -u uwctld -b`...
